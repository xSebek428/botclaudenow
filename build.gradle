plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // JitPack: tu leży MCProtocolLib 1.21.4-1 (w repo opencollab tej wersji nie ma)
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\..*' }
    }
}

configurations {
    // Biblioteki "shade" są wpakowane do środka gotowego .jar
    shade
    implementation.extendsFrom shade
}

configurations.shade {
    // To wszystko Minecraft już ma - nie dublujemy (inaczej klasy się gryzą).
    exclude group: 'org.slf4j'
    exclude group: 'com.google.code.gson'
    exclude group: 'com.google.guava'
    exclude group: 'it.unimi.dsi'
    exclude group: 'org.jetbrains'
    exclude group: 'io.netty', module: 'netty-all'
    exclude group: 'io.netty.incubator'
    exclude group: 'io.netty', module: 'netty-buffer'
    exclude group: 'io.netty', module: 'netty-common'
    exclude group: 'io.netty', module: 'netty-codec'
    exclude group: 'io.netty', module: 'netty-handler'
    exclude group: 'io.netty', module: 'netty-resolver'
    exclude group: 'io.netty', module: 'netty-transport'
    exclude group: 'io.netty', module: 'netty-transport-classes-epoll'
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
    exclude group: 'io.netty', module: 'netty-transport-native-unix-common'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Biblioteka protokołu Minecrafta - to ona łączy bota z serwerem
    shade "com.github.GeyserMC:MCProtocolLib:${project.mcprotocollib_version}"
    shade 'net.kyori:adventure-api:4.17.0'

    // Moduły Netty, których Minecraft nie ma (DNS, proxy) - wersja jak w Minecraft 1.21.4
    shade 'io.netty:netty-resolver-dns:4.1.115.Final'
    shade 'io.netty:netty-codec-dns:4.1.115.Final'
    shade 'io.netty:netty-handler-proxy:4.1.115.Final'
    shade 'io.netty:netty-codec-socks:4.1.115.Final'
    shade 'io.netty:netty-codec-http:4.1.115.Final'
    shade 'io.netty:netty-codec-haproxy:4.1.115.Final'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = 'dev-shadow'
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
}
